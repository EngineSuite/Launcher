name: Deploy Zero-Cost Revenue Nodes to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Assemble Static Distribution Portal
        run: |
          mkdir -p _site/schemacraft
          mkdir -p _site/cloudzero
          cp -r nodes/node_schemacraft_pro/public/* _site/schemacraft/
          cp -r nodes/node_dev_cheatsheet_vault/public/* _site/cloudzero/
          # Create portal landing page redirecting to primary node
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=./schemacraft/">
            <title>The Engine Digital Utilities</title>
          </head>
          <body>
            <p>Redirecting to <a href="./schemacraft/">SchemaCraft Pro</a> or <a href="./cloudzero/">CloudZero Playbook</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
