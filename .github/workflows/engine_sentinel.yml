name: The Engine - Cloud Sentinel & 24/7 Health Monitor

on:
  schedule:
    # Runs every 6 hours at zero upfront cost on GitHub's free runners
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cloud-sentinel:
    name: 24/7 Live Health & Anti-Obsolescence Sentinel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Engine Verification Test Suite
        run: |
          python -m unittest discover -s the_engine/tests

      - name: Probe Live Edge Endpoints & Uptime
        run: |
          python -m the_engine audit-live --url https://enginesuite.github.io/Launcher/

      - name: Run Anti-Obsolescence & Quality Council
        run: |
          python -m the_engine council node_schemacraft_pro

      - name: Alert on Failure (Auto-Open GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 [INCIDENT] Live Edge Deployment or Anti-Obsolescence Failure Detected";
            const body = `### The Engine Cloud Sentinel Alert
            **Timestamp (UTC):** ${new Date().toISOString()}
            **Host:** https://enginesuite.github.io/Launcher/

            A failure was detected during the automated 6-hour Sentinel run.
            - **Possible Causes:** Edge CDN latency degradation, HTTP non-200 response, unit test regression, or Anti-Obsolescence rot.
            - **Workflow Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Please inspect the workflow log for remediation steps.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["incident", "the-engine", "sentinel"]
            });
